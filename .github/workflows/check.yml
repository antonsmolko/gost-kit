name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Packages and example
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/functional-core/package-lock.json

      - name: Install package dependencies
        run: npm ci

      - name: Check packages
        run: npm run check

      - name: Install example dependencies
        working-directory: examples/functional-core
        run: npm ci

      - name: Check example
        working-directory: examples/functional-core
        run: npm run check

      - name: Build example
        working-directory: examples/functional-core
        run: npm run build

      - name: Install Chromium
        working-directory: examples/functional-core
        run: npx playwright install --with-deps chromium

      - name: Test browser scenarios
        working-directory: examples/functional-core
        run: npm run test:e2e -- --workers=1
